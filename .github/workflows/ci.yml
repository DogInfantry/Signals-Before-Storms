name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        # The dev group installs by default; --extra jump adds the optional second regime engine
        # so CI exercises that import path too.
        run: uv sync --extra jump
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q
