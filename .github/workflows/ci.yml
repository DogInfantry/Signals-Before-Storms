name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      # pyproject declares requires-python = ">=3.11". Testing one interpreter while promising three
      # is a claim the artifact never checks. If 3.11 or 3.12 fails here, the honest fix is to narrow
      # requires-python, not to delete the matrix.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        # The dev group installs by default; --extra jump adds the optional second regime engine
        # so CI exercises that import path too.
        run: uv sync --extra jump --python ${{ matrix.python-version }}
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q

  ledger-build:
    # The Storm Ledger is a real Next.js app in this repo with a tracked lockfile, and every push to
    # main deploys it. Nothing here used to build it, so a broken build first surfaced in production.
    # Separate job, so a Node failure reads as a Node failure rather than as a test failure.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ledger/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
