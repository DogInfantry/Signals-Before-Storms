[project]
name = "signals-before-storms"
version = "0.1.0"
description = "Macro-aware tactical asset allocation engine: HMM regime detection plus convex optimization, leak-proof walk-forward."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Anklesh Rawat" }]
urls = { Homepage = "https://github.com/DogInfantry/Signals-Before-Storms" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "hmmlearn>=0.3.0",
    "cvxpy>=1.5",
    "yfinance>=0.2.40",
    "curl_cffi>=0.7",
    "fredapi>=0.5",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
extra = [
    "jumpmodels",
    "PyPortfolioOpt>=1.5",
    "skfolio>=0.7",
    "quantstats>=0.0.75",
    "arch>=7.0",
    "jugaad-data",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "papermill>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_shift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
