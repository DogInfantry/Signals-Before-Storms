# All tunable knobs live here. No magic numbers in code.
seed: 42

universes:
  india:
    equity: "^NSEI"          # NIFTY 50
    bond: ""                 # no usable duration ETF on Yahoo for 2015-2023, see README
    cash: "LIQUIDBEES.NS"    # overnight/liquid fund: the defensive sleeve, honestly not a bond
    gold: "GOLDBEES.NS"      # gold ETF in INR
    vix: "^INDIAVIX"         # confirm history depth on first pull
  us:
    equity: "SPY"
    bond: "TLT"
    gold: "GLD"
    vix: "^VIX"

dates:
  start: "2015-01-01"
  end: "2024-01-01"

features:
  momentum_windows: [5, 21, 63, 126]
  vol_windows: [5, 21, 63]

# FRED series (avoid the retired ids: TEDRATE, STLFSI/2/3).
macro_fred_series: ["T10Y2Y", "BAA10Y", "NFCI"]

walkforward:
  min_train: 252
  test_size: 63
  step: 63

hmm:
  n_states: 3
  covariance_type: "diag"
  n_iter: 200
  tol: 0.01

costs_bps: 7.5
weight_cap: 0.6
rebalance: "on_regime_change"   # or "monthly"
rebalance_confirm_days: 3       # hysteresis: days a new regime must persist before we trade it
conditional_moments: true       # estimate mu/Sigma from past days in the SAME regime
conditional_min_obs: 126        # below this many same-regime days, fall back to all history
